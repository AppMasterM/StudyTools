name: Build StudyTools Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find StudyTools project folder
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find . \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/android/*' \
            -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Java version
        run: |
          java -version
          javac -version

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project:"
          pwd
          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f | sort
          echo ""
          echo "package.json:"
          cat package.json

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build StudyTools web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Install Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload StudyTools APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTools-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
