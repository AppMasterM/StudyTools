name: F-Droid Source Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - free-premium
    paths:
      - "StudyTools_Complete_Corrected/StudyTools/**"
      - ".github/workflows/fdroid.yml"

permissions:
  contents: read

concurrency:
  group: fdroid-source-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-release:
    name: Build Unsigned Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StudyTools_Complete_Corrected/StudyTools

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: StudyTools_Complete_Corrected/StudyTools/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check project files
        run: |
          test -f package.json
          test -f capacitor.config.ts
          test -f package-lock.json
          echo "Required source files found."

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Verify app configuration
        run: |
          node -e "const c=require('./package.json'); console.log('Project:', c.name); console.log('Version:', c.version);"
          grep -n 'com.studytools.app' capacitor.config.ts

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android platform
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: StudyTools_Complete_Corrected/StudyTools/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK exists
        working-directory: StudyTools_Complete_Corrected/StudyTools
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected unsigned APK was not created."
            find android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload unsigned APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: StudyTools-unsigned-release-apk
          path: StudyTools_Complete_Corrected/StudyTools/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
