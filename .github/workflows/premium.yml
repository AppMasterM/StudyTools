
name: Build StudyTools Premium APK

'on':
  workflow_dispatch:
  push:
    branches:
      - premium-edition
    paths:
      - "StudyTools_Complete_Corrected/StudyTools/**"
      - ".github/workflows/premium.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Premium APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets safely
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          failed=0

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              echo "$name: PRESENT"
            else
              echo "$name: MISSING OR EMPTY"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more signing secrets are unavailable."
            exit 1
          fi

      - name: Install dependencies
        working-directory: StudyTools_Complete_Corrected/StudyTools
        run: npm install

      - name: Build web app
        working-directory: StudyTools_Complete_Corrected/StudyTools
        run: npm run build

      - name: Install Android platform
        working-directory: StudyTools_Complete_Corrected/StudyTools
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3
          npx cap add android
          npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studytools-premium.jks"
          test -s "$RUNNER_TEMP/studytools-premium.jks"

      - name: Configure Android release signing
        working-directory: StudyTools_Complete_Corrected/StudyTools/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/studytools-premium.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build signed release APK
        working-directory: StudyTools_Complete_Corrected/StudyTools/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: StudyTools_Complete_Corrected/StudyTools/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            find app/build/outputs -type f -name "*.apk" -print
            echo "Expected signed APK was not generated."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Signed Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTools-Premium-Signed-APK
          path: StudyTools_Complete_Corrected/StudyTools/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
